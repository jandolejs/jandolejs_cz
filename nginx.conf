server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;

    # behind the Cloudflare tunnel: keep redirects (/about → /about/) relative
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    location /media/ {
        expires 7d;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
